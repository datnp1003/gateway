services:
  gateway:
    build: .
    ports:
      - "5000:8080"
    environment:
      # Admin JWT signing (Authentication:Jwt:* in code). No baked-in default:
      # compose fails fast when the host does not provide the secret.
      - Authentication__Jwt__Secret=${JWT_SECRET:?JWT_SECRET is required (32+ chars)}
      - Authentication__Jwt__Issuer=EnglishLearning.Auth
      - Authentication__Jwt__Audience=EnglishLearning.Gateway
      # Google OAuth for the management dashboard + admin email allowlist.
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      - Authentication__AllowedEmails=${GATEWAY_ALLOWED_EMAILS:?GATEWAY_ALLOWED_EMAILS is required (comma-separated)}
      # SQLite on the persistent volume below; route config survives restarts.
      - ConnectionStrings__Gateway=Data Source=/app/data/gateway.db
    volumes:
      - ./logs:/app/logs
      - gateway-data:/app/data
    networks:
      - gateway-net
    restart: unless-stopped

  # Auth Service
  auth-service:
    image: englishlearning-auth:latest
    environment:
      - ASPNETCORE_URLS=http://+:5100
    networks:
      - gateway-net
    restart: unless-stopped

  # Learning Service
  learning-service:
    image: englishlearning-learning:latest
    environment:
      - ASPNETCORE_URLS=http://+:5101
    networks:
      - gateway-net
    restart: unless-stopped

  # AI Service
  ai-service:
    image: englishlearning-ai:latest
    environment:
      - ASPNETCORE_URLS=http://+:5102
    networks:
      - gateway-net
    restart: unless-stopped

volumes:
  gateway-data:

networks:
  gateway-net:
    driver: bridge
