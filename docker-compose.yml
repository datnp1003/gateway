services:
  gateway:
    build: .
    ports:
      - "5000:8080"
    environment:
      Authentication__Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required (32+ bytes)}
      Authentication__Jwt__Issuer: Gateway.Admin
      Authentication__Jwt__Audience: Gateway.Dashboard
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      Authentication__AllowedEmails: ${GATEWAY_ALLOWED_EMAILS:?GATEWAY_ALLOWED_EMAILS is required (comma-separated)}
      ConnectionStrings__Gateway: Host=postgres;Database=gateway;Username=gateway;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - gateway-net
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - gateway-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - gateway-net
    restart: unless-stopped

volumes:
  gateway-postgres-data:

networks:
  gateway-net:
    driver: bridge
