services:
  gateway:
    build: .
    ports:
      - "5000:8080"
    environment:
      - Jwt__Secret=${JWT_SECRET:-CHANGE_ME_MINIMUM_32_CHARACTERS_LONG_KEY}
      - Jwt__Issuer=EnglishLearning.Auth
      - Jwt__Audience=EnglishLearning.Gateway
    volumes:
      - ./logs:/app/logs
    networks:
      - gateway-net
    restart: unless-stopped

  # Auth Service
  auth-service:
    image: englishlearning-auth:latest
    environment:
      - ASPNETCORE_URLS=http://+:5100
    networks:
      - gateway-net
    restart: unless-stopped

  # Learning Service
  learning-service:
    image: englishlearning-learning:latest
    environment:
      - ASPNETCORE_URLS=http://+:5101
    networks:
      - gateway-net
    restart: unless-stopped

  # AI Service
  ai-service:
    image: englishlearning-ai:latest
    environment:
      - ASPNETCORE_URLS=http://+:5102
    networks:
      - gateway-net
    restart: unless-stopped

networks:
  gateway-net:
    driver: bridge
